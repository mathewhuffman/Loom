
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Plasma Orb</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="gl"></canvas>

    <script type="module">
        const canvas = document.getElementById('gl');
        const gl = canvas.getContext('webgl2');

        if (!gl) {
            document.body.innerHTML = '<div style="color:white;text-align:center;padding-top:20px;">WebGL2 not supported</div>';
            throw new Error('WebGL2 not supported');
        }

        // Vertex Shader
        const vsSource = `#version 300 es
        in vec4 position;
        void main() {
            gl_Position = position;
        }`;

        // Fragment Shader (Adapted from user provided code)
        const fsSource = `#version 300 es
        precision highp float;
        
        uniform vec2 uResolution;
        uniform float uTime;
        uniform float uZoom;
        
        out vec4 fragColor;

        #define T uTime
        #define PI 3.141596
        #define TAU 6.283185
        #define S smoothstep
        #define s1(v) (sin(v)*.5+.5)
        const float EPSILON = 1e-3;

        mat2 rotate(float a){
            float s = sin(a);
            float c = cos(a);
            return mat2(c,-s,s,c);
        }

        // FBM function from original code (preserved though seemingly unused in main logic)
        float fbm(vec3 p){
            float amp = 1.;
            float fre = 1.;
            float n = 0.;
            for(float i =0.;i<4.;i++){
                n += abs(dot(cos(p), vec3(.1)));
                amp *= .5;
                fre *= 2.;
            }
            return n;
        }

        void main() {
            vec2 R = uResolution.xy;
            vec2 uv = (gl_FragCoord.xy * 2. - R) / R.y;
            
            // Mouse interactivity explicitly removed per instructions
            
            vec3 col = vec3(0.);
            
            // Camera setup
            vec3 ro = vec3(0., 0., -10. * uZoom);
            vec3 rd = normalize(vec3(uv, 1.));

            float zMax = 50.;
            float z = .1;

            // Auto-rotation only
            mat2 mx = rotate(T * .5);
            mat2 my = rotate(T * .5);

            vec3 p;
            for(float i=0.; i<100.; i++){
                p = ro + rd * z;

                p.xz *= mx;
                p.yz *= my;

                float d = length(p) - 5.;
                float d1;
                {
                    vec3 q = p;
                    q.xy *= rotate(T + i * 3.);
                    q.xz *= rotate(T + i * 2.);
                    q.yz *= rotate(T + i * 1.);
                    d1 = length(sin(q.xz * .08)) - .1;
                    d1 = abs(d1) * .6 + .001;
                    d1 = max(d, d1);
                }
                d = abs(d) * .3 + .01;
                d = min(d, d1);

                // Accumulate color
                col += s1(vec3(3,2,1) + dot(p, vec3(.4))) / d;
                
                if(d < EPSILON || z > zMax) break;
                z += d;
            }
            
            // Tone mapping
            col = tanh(col / 2e3);

            fragColor = vec4(col, 1.0);
        }`;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(gl, vs, fs) {
            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
                return null;
            }
            return program;
        }

        const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = createProgram(gl, vs, fs);

        // Look up locations
        const positionLoc = gl.getAttribLocation(program, 'position');
        const uResolutionLoc = gl.getUniformLocation(program, 'uResolution');
        const uTimeLoc = gl.getUniformLocation(program, 'uTime');
        const uZoomLoc = gl.getUniformLocation(program, 'uZoom');

        // Create fullscreen quad
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        const positions = new Float32Array([
            -1, -1,
             1, -1,
            -1,  1,
             1,  1,
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(positionLoc);
        gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

        function resize() {
            const displayWidth = window.innerWidth;
            const displayHeight = window.innerHeight;

            if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                canvas.width = displayWidth;
                canvas.height = displayHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
        }

        let startTime = performance.now();

        function render() {
            resize();
            
            // Get inputs
            const inputs = window.GLYPH_INPUTS || {};
            const speedMult = (inputs.speed !== undefined ? inputs.speed : 100) / 100;
            // Default zoom input 100 -> 1.0 multiplier
            const zoomMult = (inputs.zoom !== undefined ? inputs.zoom : 100) / 100;

            const currentTime = performance.now();
            const elapsed = (currentTime - startTime) * 0.001 * speedMult;

            gl.useProgram(program);
            gl.bindVertexArray(vao);

            gl.uniform2f(uResolutionLoc, canvas.width, canvas.height);
            gl.uniform1f(uTimeLoc, elapsed);
            gl.uniform1f(uZoomLoc, zoomMult); // Passed to shader to scale ro.z

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub PR Widget</title>
  <style>
    :root {
      --bg: #050505;
      --surface: #0a0a0a;
      --surface-hover: #141414;
      --border: #333;
      --primary: #00ffff;
      --primary-dim: rgba(0, 255, 255, 0.1);
      --secondary: #ff00ff;
      --text-main: #e0e0e0;
      --text-dim: #888;
      --success: #00ff00;
      --font-mono: 'SF Mono', 'Segoe UI Mono', 'Roboto Mono', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: var(--font-sans);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
    }

    /* Header */
    header {
      flex-shrink: 0;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
    }

    .repo-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .repo-icon {
      font-size: 1.2rem;
    }

    h1 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--primary);
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    button.icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
      font-size: 0.8rem;
    }

    button.icon-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 8px var(--primary-dim);
    }

    /* PR List */
    #pr-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .pr-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s, padding-left 0.2s;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      position: relative;
    }

    .pr-item:last-child {
      border-bottom: none;
    }

    .pr-item:hover {
      background: var(--surface-hover);
      padding-left: 20px;
    }

    .pr-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--primary);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pr-item:hover::before {
      opacity: 1;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 4px;
      line-height: 1.4;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .number {
      font-family: var(--font-mono);
      color: var(--secondary);
    }

    .tag {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.7rem;
    }

    .tag.open { border-color: var(--success); color: var(--success); }
    .tag.closed { border-color: #ff4444; color: #ff4444; }
    .tag.merged { border-color: #a371f7; color: #a371f7; }

    /* States */
    .empty-state, .error-state, .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 20px;
      color: var(--text-dim);
    }

    .error-state {
      color: #ff4444;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Scanline effect */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="scanline"></div>
    <header>
      <div class="repo-info">
        <span class="repo-icon">🐙</span>
        <h1 id="repo-name">Loading...</h1>
      </div>
      <div class="controls">
        <button class="icon-btn" id="refresh-btn" title="Refresh">⟳</button>
      </div>
    </header>
    <ul id="pr-list"></ul>
  </div>

  <script type="module">
    console.log("Hello world");
    // Utility: Time ago
    function timeAgo(dateString) {
      const date = new Date(dateString);
      const seconds = Math.floor((new Date() - date) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "y ago";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "mo ago";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "d ago";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "h ago";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "m ago";
      return Math.floor(seconds) + "s ago";
    }

    // Main Logic
    const inputs = window.GLYPH_INPUTS || {};
    // Use linked key "github" from vault
    const TOKEN = inputs.github;
    const REPO = inputs.repository;
    const STATE = inputs.prState || 'open';
    const LIMIT = inputs.limit || 10;
    const REFRESH_MIN = inputs.refreshInterval || 5;

    const listEl = document.getElementById('pr-list');
    const repoNameEl = document.getElementById('repo-name');
    const refreshBtn = document.getElementById('refresh-btn');

    repoNameEl.innerText = REPO || 'Setup Required';

    async function fetchPRs() {
      if (!TOKEN) {
        renderError("GitHub Token Required");
        return;
      }
      if (!REPO) {
        renderError("Repository Required (owner/repo)");
        return;
      }

      renderLoading();

      try {
        const url = `https://api.github.com/repos/${REPO}/pulls?state=${STATE}&per_page=${LIMIT}&sort=updated&direction=desc`;
        const res = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!res.ok) {
          if (res.status === 404) throw new Error("Repository not found");
          if (res.status === 401) throw new Error("Invalid Token");
          if (res.status === 403) throw new Error("Rate Limit / Forbidden");
          throw new Error(`Error: ${res.status}`);
        }

        const data = await res.json();
        renderList(data);
      } catch (err) {
        renderError(err.message);
      }
    }

    function renderLoading() {
      listEl.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <div>Fetching PRs...</div>
        </div>
      `;
    }

    function renderError(msg) {
      listEl.innerHTML = `
        <div class="error-state">
          <div style="font-size: 2rem; margin-bottom: 10px">⚠️</div>
          <div>${msg}</div>
          <div style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7">Check inputs settings</div>
        </div>
      `;
    }

    function renderList(prs) {
      if (!prs || prs.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2rem; margin-bottom: 10px">👍</div>
            <div>No ${STATE} PRs found</div>
          </div>
        `;
        return;
      }

      listEl.innerHTML = '';
      
      prs.forEach(pr => {
        const li = document.createElement('li');
        li.className = 'pr-item';
        
        // Determine status color/text
        let statusClass = 'open';
        if (pr.state === 'closed') {
            statusClass = pr.merged_at ? 'merged' : 'closed';
        }

        li.innerHTML = `
          <img src="${pr.user.avatar_url}" class="avatar" alt="${pr.user.login}" />
          <div class="content">
            <div class="title">${pr.title}</div>
            <div class="meta">
              <span class="number">#${pr.number}</span>
              <span class="tag ${statusClass}">${statusClass}</span>
              <span>by ${pr.user.login}</span>
              <span>• ${timeAgo(pr.updated_at)}</span>
            </div>
          </div>
        `;

        // Interaction
        li.addEventListener('click', () => {
          window.open(pr.html_url, '_blank');
        });

        listEl.appendChild(li);
      });
    }

    // Initial Load
    fetchPRs();

    // Event Listeners
    refreshBtn.addEventListener('click', () => {
      refreshBtn.style.transform = 'rotate(180deg)';
      setTimeout(() => refreshBtn.style.transform = 'rotate(0deg)', 300);
      fetchPRs();
    });

    // Auto Refresh
    const intervalMs = Math.max(1, REFRESH_MIN) * 60 * 1000;
    setInterval(fetchPRs, intervalMs);

    // Keyboard shortcut (R to refresh)
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r') {
        fetchPRs();
      }
    });
  </script>
</body>
</html>

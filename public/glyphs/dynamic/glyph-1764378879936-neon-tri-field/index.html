
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tri-Field</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent; /* Allow wallpaper usage */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
        }
    </style>
</head>
<body>
    <div id="ui-layer"></div>
    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.168.0';

        // --- Configuration ---
        const DEFAULT_COUNT = 800;
        const DEFAULT_SPEED = 40;
        const DEFAULT_SIZE = 15;
        const DEFAULT_COLOR_A = '#00ffff';
        const DEFAULT_COLOR_B = '#ff00ff';

        // --- State ---
        let scene, camera, renderer;
        let mesh;
        let dummy = new THREE.Object3D();
        let particlesData = [];
        let time = 0;
        
        // Cache previous inputs to detect changes
        let prevCount = 0;
        let prevSize = 0;
        let prevColorA = '';
        let prevColorB = '';

        function getInputs() {
            const inputs = window.GLYPH_INPUTS || {};
            return {
                count: parseInt(inputs.particleCount) || DEFAULT_COUNT,
                speed: parseInt(inputs.speed) !== undefined ? parseInt(inputs.speed) : DEFAULT_SPEED,
                size: parseInt(inputs.size) || DEFAULT_SIZE,
                colorA: inputs.primaryColor || DEFAULT_COLOR_A,
                colorB: inputs.secondaryColor || DEFAULT_COLOR_B
            };
        }

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            // Fog for depth
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Initial Build
            rebuildMesh();

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 1, 1).normalize();
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xffffff, 2, 500);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Events
            window.addEventListener('resize', onWindowResize, false);
            
            // Start Loop
            animate();
        }

        function rebuildMesh() {
            const inputs = getInputs();
            const count = inputs.count;
            const size = inputs.size / 10; // Scale down for ThreeJS units

            if (mesh) {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            }

            // Geometry: Tetrahedron (Triangle Pyramid)
            const geometry = new THREE.TetrahedronGeometry(size, 0);
            
            // Material: MeshPhysical for nice neon reflections
            const material = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                roughness: 0.2,
                metalness: 0.8,
                transmission: 0,
                emissive: 0x000000,
                flatShading: true
            });

            mesh = new THREE.InstancedMesh(geometry, material, count);
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            
            // Color buffer for gradients
            const colors = new Float32Array(count * 3);
            const colorA = new THREE.Color(inputs.colorA);
            const colorB = new THREE.Color(inputs.colorB);
            const tempColor = new THREE.Color();

            particlesData = [];

            for (let i = 0; i < count; i++) {
                // Random Position
                const range = 200;
                const x = (Math.random() - 0.5) * range;
                const y = (Math.random() - 0.5) * range;
                const z = (Math.random() - 0.5) * range;

                dummy.position.set(x, y, z);
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                dummy.scale.setScalar(0.5 + Math.random() * 0.5);
                dummy.updateMatrix();

                mesh.setMatrixAt(i, dummy.matrix);

                // Store individual motion data
                particlesData.push({
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1
                    ),
                    rotationSpeed: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.02,
                        (Math.random() - 0.5) * 0.02,
                        (Math.random() - 0.5) * 0.02
                    ),
                    initialPos: new THREE.Vector3(x, y, z),
                    phase: Math.random() * Math.PI * 2
                });

                // Gradient Logic
                const mixRatio = Math.random();
                tempColor.copy(colorA).lerp(colorB, mixRatio);
                colors[i * 3] = tempColor.r;
                colors[i * 3 + 1] = tempColor.g;
                colors[i * 3 + 2] = tempColor.b;
            }

            mesh.instanceColor = new THREE.InstancedBufferAttribute(colors, 3);
            scene.add(mesh);

            // Update cache
            prevCount = count;
            prevSize = inputs.size;
            prevColorA = inputs.colorA;
            prevColorB = inputs.colorB;
        }

        function updateParticles(deltaTime, speedFactor) {
            if (!mesh) return;

            const speedMult = speedFactor * 0.01;

            for (let i = 0; i < particlesData.length; i++) {
                const data = particlesData[i];
                
                // Read current matrix
                mesh.getMatrixAt(i, dummy.matrix);
                dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);

                // Update Position (Orbit + Noise-like movement)
                const t = time * speedMult + data.phase;
                
                // Base movement
                dummy.position.x += data.velocity.x * speedMult * 10;
                dummy.position.y += data.velocity.y * speedMult * 10;
                dummy.position.z += data.velocity.z * speedMult * 10;

                // Boundary wrap (toroidal space)
                const limit = 100;
                if (dummy.position.x > limit) dummy.position.x = -limit;
                if (dummy.position.x < -limit) dummy.position.x = limit;
                if (dummy.position.y > limit) dummy.position.y = -limit;
                if (dummy.position.y < -limit) dummy.position.y = limit;
                if (dummy.position.z > limit) dummy.position.z = -limit;
                if (dummy.position.z < -limit) dummy.position.z = limit;

                // Rotate individual triangle
                dummy.rotation.x += data.rotationSpeed.x * (1 + speedMult * 5);
                dummy.rotation.y += data.rotationSpeed.y * (1 + speedMult * 5);

                // Pulse scale slightly
                const scalePulse = 1 + Math.sin(t * 2) * 0.1;
                dummy.scale.setScalar((0.5 + Math.random() * 0.01) * scalePulse);

                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            }
            mesh.instanceMatrix.needsUpdate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const inputs = getInputs();

            // Detect Heavy Changes (Rebuild Mesh)
            if (inputs.count !== prevCount || inputs.size !== prevSize || 
                inputs.colorA !== prevColorA || inputs.colorB !== prevColorB) {
                rebuildMesh();
            }

            time += 0.01;

            // Global Rotation
            if (mesh) {
                mesh.rotation.y = time * 0.05 * (inputs.speed / 100);
                mesh.rotation.z = time * 0.02 * (inputs.speed / 100);
            }

            updateParticles(0.016, inputs.speed);

            renderer.render(scene, camera);
        }

        // Initialize
        init();

    </script>
</body>
</html>

name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch: # Allow manual trigger

# IMPORTANT: This gives ALL jobs permission to create releases
permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loom-win
          path: |
            release/*.exe
            release/*.yml
            release/*.yaml
            release/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.yml
            artifacts/**/*.yaml
            artifacts/**/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🔮 LOOM Update
            
            This release includes the latest features and improvements. See the changelog below for details.
            
            ### Installation
            
            **Windows:** Download and run the `.exe` installer
            
            ---
            
            *If you already have LOOM installed, it will auto-update to this version.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
